<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>artifact-to-pdf sample</title>
<style>
  :root { color-scheme: light; }
  * { margin: 0; box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; }
  .block {
    height: 200px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    font-weight: 700;
    color: #fff;
  }
</style>
</head>
<body>
  <!-- 20 x 200px = 4000px tall: guarantees a "long scroll" page for the self-check -->
  <script>
    const hues = 20;
    for (let i = 0; i < hues; i++) {
      const d = document.createElement('div');
      d.className = 'block';
      d.style.background = `hsl(${(i * 360) / hues}, 70%, 45%)`;
      d.textContent = `block ${i + 1} / ${hues}`;
      document.body.appendChild(d);
    }
  </script>
</body>
</html>
